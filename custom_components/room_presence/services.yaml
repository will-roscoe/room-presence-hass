set_state:
  fields:
    location:
      example: bed
      selector:
        text:
    activity:
      selector:
        select:
          options:
            - asleep
            - awake
          translation_key: activity
    delay:
      example: 60
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
